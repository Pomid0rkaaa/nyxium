<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyxium Interpreter</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <h1>Nyxium Interpreter</h1>
  <textarea id="code" placeholder="Type Nyxium code..."></textarea>
  <input id="stdin" type="text" placeholder="Program input (stdin)" />
  <button id="run">Run</button>
  <pre id="output"></pre>
  <script src="./nyxium.min.js"></script>
  <script>
    const code = document.getElementById("code");
    const stdin = document.getElementById("stdin");
    const output = document.getElementById("output");
    document.getElementById("run").onclick = () => {
      try {
        output.textContent = interpret(code.value, stdin.value);
      } catch (err) {
        output.textContent = err.message;
      }
    };
  </script>
</body>

</html>
