<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyxium Interpreter</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <h1>Nyxium Interpreter</h1>
  <textarea id="code" placeholder="Type Nyxium code..."></textarea>
  <input id="input" type="text" placeholder="Program input" />
  <button id="run">Run</button>
  <pre id="output"></pre>
  <script src="./nyxium.min.js"></script>
  <script>
    const code = document.getElementById("code");
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const run = document.getElementById("run");
    run.addEventListener("click", () => {
      try {
        output.textContent = interpret(code.value, input.value);
      } catch (err) {
        output.textContent = err.message;
      }
    });
  </script>
</body>

</html>
